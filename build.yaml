---
# Plugin metadata, read by jprm when packaging a release, and the single source of the plugin version.
# Directory.Build.props reads `version` from here, and the release workflow refuses a tag that does not match.
# GITHUB_REPOSITORY and GITHUB_OWNER are filled in by the release workflow.
name: "Menu Curator"
guid: "c86ff527-927b-4653-abc1-4b7d6fbf1a09"
version: "1.1.0.0"
targetAbi: "12.2.0.0"
framework: "net10.0"
imageUrl: "https://raw.githubusercontent.com/GITHUB_REPOSITORY/main/assets/banner.png"
overview: "Choose which plugin pages appear in the dashboard menu"
description: >
  Curate the Plugins section of the Jellyfin dashboard menu. Hide pages you do not
  use, add pages that their plugins leave out of the menu, and change each entry's
  name, icon and position. Changes apply to the dashboard for every administrator.
category: "General"
owner: "GITHUB_OWNER"
artifacts:
  - "Jellyfin.Plugin.MenuCurator.dll"
changelog: >
  Reset the menu from the settings page or the new "Reset dashboard menu" scheduled
  task. The menu now returns to normal as soon as Menu Curator is uninstalled.
