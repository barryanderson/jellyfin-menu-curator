name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Jellyfin.Plugin.MenuCurator.slnx -c Release

      - name: Test
        run: dotnet test Jellyfin.Plugin.MenuCurator.slnx -c Release --no-build
